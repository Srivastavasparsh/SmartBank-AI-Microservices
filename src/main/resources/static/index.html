<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank AI - Microservices Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 450px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 20px; display: block; }
        .balance-box { background: #e0f7fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .balance-title { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        .balance-amount { font-size: 32px; font-weight: bold; color: #006064; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 10px; }
        button:hover { background: #0056b3; }
        .feed-container { margin-top: 15px; text-align: left; max-height: 180px; overflow-y: auto; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 10px; }
        .feed-item { font-size: 12px; padding: 8px; margin-bottom: 6px; border-radius: 6px; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; font-family: monospace; word-break: break-all; }
        .loading { color: #666; font-style: italic; margin-top: 5px; display: none; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <span class="logo">🔒 SecureBank AI</span>

    <div class="balance-box">
        <div class="balance-title">Monitored Account</div>
        <div class="balance-amount">$5,000.00</div>
    </div>

    <button onclick="triggerAnalysis(1)">⚡ Trigger Normal Transaction (ID: 1)</button>
    <button onclick="triggerAnalysis(99)" style="background: #6c757d;">⚠️ Trigger Edge Case (ID: 99)</button>
    <div id="loading" class="loading">Publishing transaction payload to RabbitMQ...</div>

    <div style="text-align: left; font-size: 12px; color: #666; margin-top: 15px; font-weight: bold;">Live Event History Feed:</div>
    <div id="event-feed" class="feed-container">
        <div style="color: #adb5bd; text-align: center; font-style: italic; font-size: 12px; padding: 10px;" id="placeholder">No events recorded yet. Click a button above!</div>
    </div>
</div>

<script>
    async function triggerAnalysis(accountId) {
        document.getElementById('loading').style.display = 'block';

        try {
            const response = await fetch(`/${accountId}/analyze`);
            const text = await response.text();
            
            document.getElementById('loading').style.display = 'none';

            const feed = document.getElementById('event-feed');
            const placeholder = document.getElementById('placeholder');
            if (placeholder) {
                placeholder.remove();
            }

            const timestamp = new Date().toLocaleTimeString();
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerHTML = `<strong>[${timestamp}]</strong> ID ${accountId}: ${text}`;
            
            feed.prepend(item); // Appends the newest event to the top of the scrolling list
        } catch (error) {
            alert("Error connecting to server!");
            document.getElementById('loading').style.display = 'none';
        }
    }
</script>
</body>
</html>
